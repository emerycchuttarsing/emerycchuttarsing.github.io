<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc"><title id="title">Inside a pre-norm decoder block</title><desc id="desc">Residual width is 256. LayerNorm then masked attention uses eight heads, each with 32-dimensional queries, keys and values. Add the original input. LayerNorm then a feed-forward network expands to 384 and returns to 256; add the second residual.</desc>
