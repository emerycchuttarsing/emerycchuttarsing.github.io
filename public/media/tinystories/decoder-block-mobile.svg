<text x="22" y="28" font-size="12" fill="#68616b" text-anchor="start" font-weight="normal" class="mono">ONE PRE-NORM BLOCK</text>
<text x="200" y="60" font-size="16" fill="#766084" text-anchor="middle" font-weight="normal" class="mono">H · T × 256</text>
