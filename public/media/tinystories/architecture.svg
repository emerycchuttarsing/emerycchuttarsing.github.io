<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-labelledby="title desc"><title id="title">From token IDs to next-token probabilities</title><desc id="desc">For one sequence, symbolic token IDs select rows from an embedding table E of shape 3000 by 256. Add positional encodings. Five decoder blocks preserve T by 256. Final LayerNorm and projection using the transpose of E produce T by 3000 logits, followed by softmax. Colored cells are schematic.</desc>
