<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 290" role="img" aria-labelledby="title desc"><title id="title">Inside one pre-norm Transformer block</title><desc id="desc">Input H passes through LayerNorm and masked multi-head self-attention, then the first residual addition. LayerNorm and a position-wise feed-forward network precede the second residual addition. Eight heads of dimension 32 preserve width 256. The triangular matrix shows allowed attention positions, not measured attention weights.</desc>
