<svg xmlns="http://www.w3.org/2000/svg" width="440" height="940" viewBox="0 0 440 940" role="img" aria-labelledby="title desc"><title id="title">Two ways to score a missing link</title><desc id="desc">Matrix factorization learns node vectors directly and scores their dot product. The GCN aggregates neighbours through three layers, then an MLP scores pair features. Both receive feedback from their respective training losses.</desc>
