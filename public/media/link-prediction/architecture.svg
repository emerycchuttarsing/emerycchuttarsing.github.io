<rect x="880" y="294" width="270" height="72" rx="5" fill="#467c78" fill-opacity=".07" stroke="#467c78" stroke-opacity=".5"/>
<text x="1015.0" y="327.0" font-family="Arial,sans-serif" font-size="18" fill="#467c78" text-anchor="middle" font-weight="bold">MLP → sigmoid</text>
