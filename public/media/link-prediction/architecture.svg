<rect x="530" y="332" width="15" height="22" rx="2" fill="#467c78" fill-opacity="0.8"/>
<text x="492.0" y="384" font-family="Arial,sans-serif" font-size="14" fill="#6e6a60" text-anchor="middle" font-weight="normal">Two 256D vectors</text>
<path d="M565 330H601" stroke="#6e6a60" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="615" y="294" width="200" height="72" rx="5" fill="#467c78" fill-opacity=".07" stroke="#467c78" stroke-opacity=".5"/>
<text x="715.0" y="327.0" font-family="Arial,sans-serif" font-size="18" fill="#467c78" text-anchor="middle" font-weight="bold">Pair features</text>
<text x="715.0" y="350.0" font-family="Arial,sans-serif" font-size="14" fill="#6e6a60" text-anchor="middle" font-weight="normal">1,024 values</text>
