<rect x="501" y="64" width="230" height="66" rx="5" fill="#997039" fill-opacity=".07" stroke="#997039" stroke-opacity=".5"/>
<text x="616.0" y="94.0" font-family="Arial,sans-serif" font-size="18" fill="#997039" text-anchor="middle" font-weight="bold">Dot product</text>
<text x="616.0" y="117.0" font-family="Arial,sans-serif" font-size="14" fill="#6e6a60" text-anchor="middle" font-weight="normal">Vector similarity</text>
<path d="M747 97H807" stroke="#6e6a60" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="824" y="64" width="326" height="66" rx="5" fill="#997039" fill-opacity=".07" stroke="#997039" stroke-opacity=".5"/>
<text x="987.0" y="94.0" font-family="Arial,sans-serif" font-size="18" fill="#997039" text-anchor="middle" font-weight="bold">Link score</text>
<text x="987.0" y="117.0" font-family="Arial,sans-serif" font-size="14" fill="#6e6a60" text-anchor="middle" font-weight="normal">Raw similarity · sigmoid at evaluation</text>
<path d="M987 143V175H404V123H394" stroke="#6e6a60" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="655" y="198" font-family="Arial,sans-serif" font-size="17" fill="#997039" text-anchor="middle" font-weight="normal">Squared error + L₂  →  full-batch gradient descent  →  update U</text>
<text x="1150" y="35" font-family="Arial,sans-serif" font-size="15" fill="#6e6a60" text-anchor="end" font-weight="normal">10 dimensions · 50 epochs</text>
<path d="M26 227H1150" stroke="#d9d1c2"/>
