<text x="101.0" y="94.0" font-family="Arial,sans-serif" font-size="18" fill="#997039" text-anchor="middle" font-weight="bold">User IDs</text>
<text x="101.0" y="117.0" font-family="Arial,sans-serif" font-size="14" fill="#6e6a60" text-anchor="middle" font-weight="normal">u and v</text>
