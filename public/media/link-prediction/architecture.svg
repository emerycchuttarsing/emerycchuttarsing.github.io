<rect x="330" y="64" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.8"/>
<rect x="350" y="64" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.30000000000000004"/>
<rect x="370" y="64" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.5"/>
<rect x="270" y="98" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.5"/>
<rect x="290" y="98" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.7"/>
<rect x="310" y="98" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.2"/>
<rect x="330" y="98" width="17" height="22" rx="2" fill="#997039" fill-opacity="0.4"/>
