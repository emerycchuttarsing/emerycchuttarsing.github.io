<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title desc"><title id="title">Two ways to score a missing link</title><desc id="desc">Matrix factorization learns node vectors directly and scores their dot product. The GCN aggregates neighbours through three layers, then an MLP scores pair features. Both receive feedback from their respective training losses.</desc>
<rect width="1180" height="460" fill="#f6f2e9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e6a60"/></marker></defs>
